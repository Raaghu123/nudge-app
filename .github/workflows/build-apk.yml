name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter doctor -v
        working-directory: .

      - name: Scaffold Android and patch manifest
        working-directory: .
        shell: bash
        run: |
          flutter create . --project-name nudge --org com.nudge.app --platforms android
          python3 patch_android.py
          flutter pub get

      - run: flutter analyze || true
        working-directory: .

      - run: flutter build apk --debug
        working-directory: .

      - uses: actions/upload-artifact@v5
        with:
          name: nudge-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
